<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Jasmine</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:opsz,wght@14..32,400;14..32,500&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #080808;
        color: #f4f2ee;
        font-family: "Inter", sans-serif;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-family: "Anton", sans-serif;
        font-weight: 400;
        font-size: clamp(8rem, 30vw, 20rem);
        line-height: 0.9;
        text-transform: uppercase;
        color: #e8ff59;
      }
      p {
        max-width: 34rem;
        color: #8b8880;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.9rem 1.8rem;
        border: 1px solid rgba(244, 242, 238, 0.2);
        border-radius: 999px;
        color: #f4f2ee;
        font-family: "DM Mono", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-decoration: none;
        transition: border-color 0.2s, color 0.2s;
      }
      a:hover { border-color: #e8ff59; color: #e8ff59; }
      small {
        position: fixed;
        bottom: 1.5rem;
        font-family: "DM Mono", monospace;
        font-size: 0.7rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #8b8880;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>This page wandered off. Even my portfolio has edge cases.</p>
    <a href="/">← Back home</a>
    <small>✦ jxsmine.world</small>
  </body>
</html>
